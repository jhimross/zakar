# Cloudflare Pages config. Pages reads this file when deploying from GitHub.
name = "mynotes"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "mynotes"
# Replace with the id printed by: npx wrangler d1 create mynotes
database_id = "52e3eced-4f8e-47a3-aa20-6c07f1e3f0a6"
migrations_dir = "migrations"

[vars]
# Fill these in after setting up Cloudflare Access (see README).
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ALLOWED_EMAILS = ""
